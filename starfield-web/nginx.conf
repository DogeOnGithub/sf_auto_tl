server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS，配合下面 proxy_pass 里的变量让 nginx 在每次请求时才解析上游。
    #
    # 不能写成 `proxy_pass http://starfield-api:8080;` 这种静态主机名：那种写法只在配置
    # 加载时解析一次，IP 会被缓存到 worker 进程生命周期结束。而容器 stop 时 IP 会归还
    # IPAM 池、start 时重新领取，所以单独 `docker compose restart starfield-api` 之后
    # api 的 IP 就变了，nginx 却还在往旧 IP 发请求。
    #
    # 线上真实事故：api 从 172.18.0.4 换到 172.18.0.2，而 172.18.0.4 被 engine 顶替，
    # engine 只监听 5001，nginx 往它的 8080 打请求被直接 RST，全站接口瞬间 502
    # （日志形态是 connect() failed (111: Connection refused)）。
    #
    # valid=10s 是 IP 变更后的最长收敛时间，够短且不会给内置 DNS 带来可观压力。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 主机名必须放进变量才会触发运行时解析，直接写字面量的话 resolver 不生效。
        # 结尾拼 $request_uri 是为了和原先不带 URI 的 proxy_pass 行为保持一致：
        # 那种写法会把客户端原始请求 URI（含 /api/ 前缀和查询串）整体透传给上游，
        # 而带变量的 proxy_pass 不会自动补 URI，漏掉就会把路径截断成 /。
        set $api_upstream starfield-api;
        proxy_pass http://$api_upstream:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4096m;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}
