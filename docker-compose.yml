services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starfield
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  starfield-engine:
    build: ./starfield-engine
    ports:
      - "5001:5001"
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      # 以下默认值与 engine/llm_client.py 里的常量保持一致 改一处记得改另一处
      LLM_OUTPUT_TOKEN_BUDGET: ${LLM_OUTPUT_TOKEN_BUDGET:-3200}
      LLM_MAX_BATCH_CHARS: ${LLM_MAX_BATCH_CHARS:-8000}
      LLM_MAX_BATCH_RECORDS: ${LLM_MAX_BATCH_RECORDS:-80}
      # 留空即不下发 max_tokens 由 provider 用自己的默认上限 填超了会直接 400
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-300}
      LLM_MAX_SPLIT_DEPTH: ${LLM_MAX_SPLIT_DEPTH:-4}
      LLM_MAX_PROMPT_DICT_ENTRIES: ${LLM_MAX_PROMPT_DICT_ENTRIES:-200}
      LLM_GLOSSARY_MAX_CHARS: ${LLM_GLOSSARY_MAX_CHARS:-60000}
      LLM_GLOSSARY_MAX_TERMS: ${LLM_GLOSSARY_MAX_TERMS:-150}
      # 用兜底 KEY（即上面的 LLM_API_KEY）时允许翻译的词条上限 超过则要求用户自带地址和 KEY
      # 默认值与 engine/translator.py 的 MAX_ENTRIES_WITHOUT_OWN_KEY 保持一致
      MAX_ENTRIES_WITHOUT_OWN_KEY: ${MAX_ENTRIES_WITHOUT_OWN_KEY:-100000}
      # INFO 才能看到 token 用量汇总 逐条原文译文在 DEBUG
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_BASE_URL: http://starfield-api:8080
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health').status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  starfield-api:
    build: ./starfield-api
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Duser.timezone=Asia/Shanghai
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: starfield
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      ENGINE_BASE_URL: http://starfield-engine:5001
      # 轮询间隔与失败容忍时长：判死阈值 = 容忍时长 / 轮询间隔 只调这两个值不要动代码常量
      ENGINE_SYNC_INTERVAL_MS: ${ENGINE_SYNC_INTERVAL_MS:-30000}
      ENGINE_SYNC_FAIL_TOLERANCE_MINUTES: ${ENGINE_SYNC_FAIL_TOLERANCE_MINUTES:-30}
      API_BASE_URL: http://starfield-api:8080
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET_NAME: ${COS_BUCKET_NAME}
      COS_BASE_URL: ${COS_BASE_URL}
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      starfield-engine:
        condition: service_started

  starfield-web:
    build: ./starfield-web
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - starfield-api

volumes:
  pgdata:
  uploads:
