services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starfield
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  starfield-engine:
    build: ./starfield-engine
    ports:
      - "5001:5001"
    environment:
      # 注意：默认额度的凭证不在这里配置。引擎运行时从 starfield-api 拉取「模型池」成员，
      # 池为空时直接拒绝走默认额度的任务，不回退到任何内置 KEY——
      # 回退会让「配置漏了」表现成「悄悄花了别的钱」。
      # LLM_API_KEY / LLM_BASE_URL / LLM_MODEL 现在只给 starfield-api 用于一次性种子导入。
      #
      # 模型池调度参数 默认值与 engine/llm_config.py 里的常量保持一致 改一处记得改另一处
      LLM_POOL_USAGE_WINDOW_DAYS: ${LLM_POOL_USAGE_WINDOW_DAYS:-7}
      LLM_POOL_CONFIG_TTL_SECONDS: ${LLM_POOL_CONFIG_TTL_SECONDS:-60}
      LLM_POOL_STAT_FLUSH_REQUESTS: ${LLM_POOL_STAT_FLUSH_REQUESTS:-100}
      LLM_POOL_MAX_MEMBER_SWITCHES: ${LLM_POOL_MAX_MEMBER_SWITCHES:-2}
      LLM_POOL_COOLDOWN_RATE_LIMIT: ${LLM_POOL_COOLDOWN_RATE_LIMIT:-60}
      LLM_POOL_COOLDOWN_AUTH: ${LLM_POOL_COOLDOWN_AUTH:-1800}
      LLM_POOL_COOLDOWN_QUOTA: ${LLM_POOL_COOLDOWN_QUOTA:-1800}
      LLM_POOL_COOLDOWN_MODEL_NOT_FOUND: ${LLM_POOL_COOLDOWN_MODEL_NOT_FOUND:-1800}
      LLM_POOL_COOLDOWN_TRANSIENT: ${LLM_POOL_COOLDOWN_TRANSIENT:-15}
      # 以下默认值与 engine/llm_config.py 里的常量保持一致 改一处记得改另一处
      LLM_OUTPUT_TOKEN_BUDGET: ${LLM_OUTPUT_TOKEN_BUDGET:-3200}
      LLM_MAX_BATCH_CHARS: ${LLM_MAX_BATCH_CHARS:-8000}
      LLM_MAX_BATCH_RECORDS: ${LLM_MAX_BATCH_RECORDS:-80}
      # 留空即不下发 max_tokens 由 provider 用自己的默认上限 填超了会直接 400
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-300}
      LLM_MAX_SPLIT_DEPTH: ${LLM_MAX_SPLIT_DEPTH:-4}
      LLM_MAX_PROMPT_DICT_ENTRIES: ${LLM_MAX_PROMPT_DICT_ENTRIES:-200}
      LLM_GLOSSARY_MAX_CHARS: ${LLM_GLOSSARY_MAX_CHARS:-60000}
      LLM_GLOSSARY_MAX_TERMS: ${LLM_GLOSSARY_MAX_TERMS:-150}
      # 走默认额度（模型池）时允许翻译的词条上限 超过则要求用户自带地址、KEY 和模型名
      # 池化后被抽干的是整个池而不是单个 KEY 所以这个上限照旧生效、不随成员数放大
      # 默认值与 engine/llm_config.py 的 MAX_ENTRIES_WITHOUT_OWN_KEY 保持一致
      MAX_ENTRIES_WITHOUT_OWN_KEY: ${MAX_ENTRIES_WITHOUT_OWN_KEY:-100000}
      # 判定「整个文件已经汉化过」的中文词条占比阈值 达到就直接拒绝翻译
      # 调低会更激进地拦截 但可能误杀还有真实工作量的半成品
      # 默认值与 engine/llm_config.py 的 ALREADY_TRANSLATED_RATIO 保持一致
      ALREADY_TRANSLATED_RATIO: ${ALREADY_TRANSLATED_RATIO:-0.98}
      ALREADY_TRANSLATED_MIN_RECORDS: ${ALREADY_TRANSLATED_MIN_RECORDS:-30}
      # INFO 才能看到 token 用量汇总 逐条原文译文在 DEBUG
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_BASE_URL: http://starfield-api:8080
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health').status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  starfield-api:
    build: ./starfield-api
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Duser.timezone=Asia/Shanghai
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: starfield
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      ENGINE_BASE_URL: http://starfield-engine:5001
      # 轮询间隔与失败容忍时长：判死阈值 = 容忍时长 / 轮询间隔 只调这两个值不要动代码常量
      ENGINE_SYNC_INTERVAL_MS: ${ENGINE_SYNC_INTERVAL_MS:-30000}
      ENGINE_SYNC_FAIL_TOLERANCE_MINUTES: ${ENGINE_SYNC_FAIL_TOLERANCE_MINUTES:-30}
      API_BASE_URL: http://starfield-api:8080
      # 模型池用量窗口 必须与 starfield-engine 的同名变量一致
      # 否则管理页展示的用量分布不是引擎调度实际依据的分布
      LLM_POOL_USAGE_WINDOW_DAYS: ${LLM_POOL_USAGE_WINDOW_DAYS:-7}
      # 池化上线用的一次性种子导入：池为空且 LLM_API_KEY 有值时启动会自动导入第一个成员
      # 之后成员在前端星裔页面维护 这三项即可从部署配置中移除
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET_NAME: ${COS_BUCKET_NAME}
      COS_BASE_URL: ${COS_BASE_URL}
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      starfield-engine:
        condition: service_started

  starfield-web:
    build: ./starfield-web
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - starfield-api

volumes:
  pgdata:
  uploads:
